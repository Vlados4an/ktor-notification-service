ktor:
  application:
    modules:
      - ru.clevertec.ApplicationKt.module
  deployment:
    port: 8095
database:
  url: jdbc:postgresql://localhost:5436/student-course-api
  user: admin
  password: pass
  driver: org.postgresql.Driver
  maxPoolSize: 10
liquibase:
  changelog: db/changelog/db.changelog-master.yaml


kafka:
  bootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  consumer:
    groupId: "notification-service-consumer-group"
    clientId: "notification-service-consumer"
    autoOffsetReset: "earliest"
    enableAutoCommit: false
  topics:
    notificationEvents: "notification-events"